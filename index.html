<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/components/section.css">
    <link rel="stylesheet" href="./css/components/header.css">
    <link rel="stylesheet" href="./css/components/action.css">
    <link rel="stylesheet" href="./css/components/titles.css">
    <link rel="stylesheet" href="./css/components/button.css">
    <link rel="stylesheet" href="./css/components/skills.css">   
    <link rel="stylesheet" href="./css/components/progress.css">
    <title>Portfólio - Dev Fabrício</title>
</head>

<body>
    <header class="header">
        <section class="section">
            <a href="index.html" class="logo">
                <img height="120" src="./img/logo_s_fundo.png" alt="logo">
            </a>
            <nav class="nav">
                <a class="action" href="#inicio">Início</a>
                <a class="action" href="#skills" lang="en">Skills</a>
                <a class="action" href="#sobre">Sobre</a>
                <a class="action" href="#projetos">Projetos</a>
                <a class="action" href="#contatos">Contatos</a>
            </nav>
            <a class="btn" href="download">Download CV</a>
        </section>
    </header>
    <section>
        <div class="inicio" id="inicio">
            <div class="caixa_titulos">
                <h1 class="titulos">Fabrício Moura</h1>
                <h2 class="subtitulos" lang="en">Developer</h2>
            </div>
            <div class="botoes">
                <a class="btn" href="download">Download CV</a>
                <a class="btn" href="#contatos">Contatos</a>
            </div>
        </div>
    </section>
    <section class="section -second">
        <div class="skills" id="skills">
            <h2 class="subtitulos -second" lang="en">Skills</h2>
            <div class="caixa_skills">
                <dl>
                    <img src="./img/html.svg" alt="Logo HTML" class="icone">
                    <div class="skills_item">
                        <dt class="titulo_terciario">HTML</dt>
                        <dd>
                            <progress class="barra" max="100" value="70">70%</progress>
                        </dd>
                    </div>
                </dl>
                <dl>
                    <img src="./img/css.svg" alt="Logo CSS" class="icone">
                    <div class="skills_item">
                        <dt class="titulo_terciario">CSS</dt>
                        <dd>
                            <progress class="barra" max="100" value="70">70%</progress>
                        </dd>
                    </div>
                </dl>
                <dl>
                    <img src="./img/javascript.svg" alt="Logo JavaScript" class="icone">
                    <div class="skills_item">
                        <dt class="titulo_terciario">JavaScript</dt>
                        <dd>
                            <progress class="barra" max="100" value="70">70%</progress>
                        </dd>
                    </div>
                </dl>
                <dl>
                    <img src="./img/python.svg" alt="Logo Python" class="icone">
                    <div class="skills_item">
                        <dt class="titulo_terciario">Python</dt>
                        <dd>
                            <progress class="barra" max="100" value="70">70%</progress>
                        </dd>
                    </div>
                </dl>
                <dl>
                    <img src="./img/nodejs.svg" alt="Logo Node.js" class="icone">
                    <div class="skills_item">
                        <dt class="titulo_terciario">Node.js</dt>
                        <dd>
                            <progress class="barra" max="100" value="70">70%</progress>
                        </dd>
                    </div>
                </dl>
                <dl>
                    <img src="./img/php.svg" alt="Logo PHP" class="icone">
                    <div class="skills_item">
                        <dt class="titulo_terciario">PHP</dt>
                        <dd>
                            <progress class="barra" max="100" value="70">70%</progress>
                        </dd>
                    </div>
                </dl>                                                
            </div>
        </div>
    </section>
</body>

</html>
